server {
    listen 80 default_server;
    server_name _;

    return 301 https://www.genstory.cc$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name www.genstory.cc;

    ssl_certificate /etc/letsencrypt/live/www.genstory.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.genstory.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* (serviceworker\.js|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf|mp3|ogg|wav|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
